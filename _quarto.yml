project:
  type: website
  output-dir: _site
  resources:
    - assets/
  render:
    - "*.qmd"
website:
  title: "GIBI LAB"
  site-url: https://gibi-lab.github.io
  open-graph: true
  back-to-top-navigation: true
  description: "GIBI-LAB 课题组网站 · 内容筹备中"
  navbar:
    background: light
    left:
      - text: Project
        menu:
          - href: spatial-imaging.qmd
            text: "空间影像"
          - href: color-science.qmd
            text: "色彩科学"
          - href: imaging-evaluation.qmd
            text: "影像评测"
      - href: people.qmd
        text: People
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publication
      - href: about.qmd
        text: "介绍"
    right:
      - href: /en/index.html
        text: "English"
      - icon: github
        href: https://github.com/GIBI-LAB
        aria-label: GitHub organization
  page-footer:
    left: "GIBI-LAB"
    right: "内容筹备中"
  search: true
format:
  html:
    theme: cosmo
    css: assets/styles.css
    include-in-header:
      text: '<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">'
    toc: false
    lang: zh-CN
    link-external-newwindow: true
