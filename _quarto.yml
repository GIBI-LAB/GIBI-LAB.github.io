  site-url: https://gibi-lab.github.io
  favicon: assets/favicon.svg
  open-graph: true
  back-to-top-navigation: true
  repo-url: https://github.com/GIBI-LAB/GIBI-LAB.github.io
  repo-actions: [issue]
  description: "GIBI-LAB 课题组网站 · 内容筹备中"
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: people.qmd
        text: People
      - href: publications.qmd
        text: Publications
      - href: news.qmd
        text: News
    right:
      - icon: github
        href: https://github.com/GIBI-LAB
        aria-label: GitHub organization
  page-footer:
    left: "GIBI-LAB · 课题组网站"
    right: "内容筹备中 / Website in preparation"
